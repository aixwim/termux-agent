# termux-agent configuration. Copy to ~/.termux-agent/config.yaml and edit.
#
# How to use:
#   1. termux-agent init            -> creates this file in ~/.termux-agent/
#   2. set the API key in the env (or in this file):
#        export OPENAI_API_KEY=sk-...        # or ANTHROPIC_API_KEY, GROQ_API_KEY, etc.
#   3. termux-agent                 -> interactive mode
#      termux-agent "prompt"        -> one-shot mode

# Default provider. zen = OpenCode Zen; free models work without an API key.
provider: zen

# Default model (may be empty -> uses the first model from the provider preset)
model: nemotron-3-ultra-free

temperature: 0.7

# Max tool-call rounds before being forced to finish (prevents infinite loops)
max_tool_rounds: 20

# When cumulative tokens used in a session pass this budget, old history is
# auto-summarized (compact) to keep context small. 0 = disabled.
max_context_tokens: 0

# Retry transient failures (network blips, HTTP 5xx) before giving up;
# useful on mobile connections. HTTP 429 instead switches to a fallback model.
retries: 1
retry_backoff: 1.0

# Extra command prefixes that never need confirmation (in addition to the built-in
# safe list). e.g. whitelisted_commands: ["pip install", "python app.py"]
whitelisted_commands: []

# Send a Termux notification when a one-shot task finishes (needs termux-api).
notify_on_done: false

# Working directory: default boundary for read/write/command tools
working_dir: "~"

# Ask for confirmation before running commands that are not in the whitelist
confirm_commands: true

# Timeout (seconds) for shell commands
command_timeout: 60

# Truncate tool output to save memory on mobile devices
max_output_chars: 60000

# Allow file tools to access Android storage (/storage/emulated/0).
# Run this first: termux-setup-storage (creates ~/storage).
allow_storage: false

# Provider presets. api_key_env = name of the env var holding the API key.
providers:
  openai:
    type: openai_compat
    base_url: https://api.openai.com/v1
    models: [gpt-4o-mini, gpt-4o, gpt-4.1-mini]
    api_key_env: OPENAI_API_KEY

  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    models: [claude-sonnet-4-20250514, claude-haiku-4-5-20251001]
    api_key_env: ANTHROPIC_API_KEY

  openrouter:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    models: [anthropic/claude-3.5-sonnet, openai/gpt-4o, meta-llama/llama-3.3-70b-instruct]
    api_key_env: OPENROUTER_API_KEY

  # Local models on the device. Install: pkg install ollama && ollama pull llama3.2
  ollama:
    type: openai_compat
    base_url: http://localhost:11434/v1
    models: [llama3.2, qwen2.5-coder:7b, deepseek-coder-v2]
    api_key_env: ""

  groq:
    type: openai_compat
    base_url: https://api.groq.com/openai/v1
    models: [llama-3.3-70b-versatile, deepseek-r1-distill-llama-70b]
    api_key_env: GROQ_API_KEY

  deepseek:
    type: openai_compat
    base_url: https://api.deepseek.com/v1
    models: [deepseek-chat, deepseek-reasoner]
    api_key_env: DEEPSEEK_API_KEY

  gemini:
    type: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    models: [gemini-2.0-flash, gemini-2.5-flash]
    api_key_env: GEMINI_API_KEY

  # OpenCode Zen (https://opencode.ai/zen): "free" models work without an API key,
  # other models need OPENCODE_API_KEY from https://opencode.ai/auth.
  zen:
    type: openai_compat
    base_url: https://opencode.ai/zen/v1
    models: [nemotron-3-ultra-free, nemotron-3.5-lightning-free, mimo-v2.5-free, hy3-free, laguna-s-2.1-free, muse-spark-1.2-contributor-free, x-preview-f-free, big-pickle]
    api_key_env: OPENCODE_API_KEY
    # tried in order when the selected model is rate-limited or unavailable
    fallback_models: [big-pickle, laguna-s-2.1-free, x-preview-f-free, nemotron-3.5-lightning-free, mimo-v2.5-free, hy3-free, muse-spark-1.2-contributor-free]

  xai:
    type: openai_compat
    base_url: https://api.x.ai/v1
    models: [grok-3-mini, grok-3, grok-4]
    api_key_env: XAI_API_KEY

  mistral:
    type: openai_compat
    base_url: https://api.mistral.ai/v1
    models: [mistral-large-latest, mistral-small-latest, codestral-latest]
    api_key_env: MISTRAL_API_KEY

  cerebras:
    type: openai_compat
    base_url: https://api.cerebras.ai/v1
    models: [cerebras-grok-3-mini, llama-3.3-70b, gpt-4.1]
    api_key_env: CEREBRAS_API_KEY
