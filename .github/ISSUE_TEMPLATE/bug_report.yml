name: Bug report
description: Report reproducible incorrect behavior in termux-agent
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not disclose vulnerabilities or secrets here. Follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest commands or configuration needed to reproduce the issue. Remove secrets.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: termux-agent version
      placeholder: termux-agent --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Android/Termux and Python versions, or another operating system.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant output after removing tokens, paths, and personal data.
      render: shell
