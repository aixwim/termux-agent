[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-agent"
version = "1.2.0"
description = "A CLI coding agent for Termux, like opencode - multi-provider LLM with a tool-use loop."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["termux", "android", "ai", "agent", "cli", "coding", "llm", "assistant", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/aixwim/termux-agent"
Repository = "https://github.com/aixwim/termux-agent"
"Bug Tracker" = "https://github.com/aixwim/termux-agent/issues"
Documentation = "https://github.com/aixwim/termux-agent/blob/main/README.md"

[project.scripts]
termux-agent = "termux_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "flake8>=7.0"]

[tool.setuptools.packages.find]
include = ["termux_agent*"]

[tool.setuptools.package-data]
termux_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
